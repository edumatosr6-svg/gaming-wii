<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hub de jogos — wii-controller</title>
    <link rel="stylesheet" href="./hub.css" />
  </head>
  <body>
    <h1>Escolha um jogo</h1>
    <div id="hub-container"></div>

    <script type="module">
      import { games } from './games.js';
      import { renderHub, validateCatalog } from './hub.js';

      validateCatalog(games);
      renderHub(document.getElementById('hub-container'), games);
    </script>
  </body>
</html>
