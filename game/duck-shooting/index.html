<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duck Shooting — wii-controller</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14171c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
      }
      canvas {
        max-width: 100vw;
        max-height: 100vh;
        image-rendering: pixelated;
      }
      #hint {
        position: fixed;
        bottom: 6px;
        left: 0;
        right: 0;
        text-align: center;
        color: #667;
        font-size: 12px;
      }
      #back-to-hub {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        padding: 4px 10px;
        font-size: 12px;
        font-family: system-ui, sans-serif;
        color: #cfd3ff;
        background: rgba(20, 23, 28, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <a id="back-to-hub" href="../index.html">&larr; Hub</a>
    <div id="hint">Tecla O: overlay de latência</div>
    <script type="module">
      import { startGame } from './js/loop.js';
      startGame(document.getElementById('game-canvas'));
    </script>
  </body>
</html>
