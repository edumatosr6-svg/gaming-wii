[tool.pytest.ini_options]
# Testes que exigem hardware/driver real são excluídos da execução padrão
# (tools/tooling.md): rode `pytest -m hardware` para incluí-los.
addopts = "-m 'not hardware'"
markers = [
    "hardware: exige driver ViGEmBus, celular ou sensores reais",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
